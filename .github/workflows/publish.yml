# Publishes euthyna to npm, cuts the matching GitHub release, and pushes both
# skill editions to ClawHub.
#
# Two ways to run:
#
#   push of a v* tag   — the real release. The tag must match package.json's
#                        version exactly; a mismatch fails before anything ships.
#   workflow_dispatch  — a rehearsal by default: the full chain runs, the
#                        release notes are rendered for inspection, and
#                        `npm publish --dry-run` validates the tarball without
#                        uploading. Tick "publish" to release manually.
#
# The release notes are a versioned template (.github/release-notes-template.md)
# with the version substituted in, so every release carries the same format and
# format changes are reviewed like any other file.
#
# Publishing uses trusted publishing (OIDC): the npm CLI exchanges the runner's
# id-token for a short-lived registry token, so there is no long-lived NPM_TOKEN
# secret at all. The trust relationship is configured on npmjs.com — the
# package's Settings → Publishing access lists this workflow (publish.yml) as a
# GitHub Actions publisher, with direct `npm publish` allowed (a configuration
# created after 2026-09-03 allows only `npm stage publish` unless direct
# publishing is selected explicitly). npm attaches a provenance attestation
# automatically on trusted-publisher publishes.
#
# A version already on the registry is skipped by the gate rather than failing
# the run, which makes a duplicated tag a no-op.
#
# ## Why this is three jobs rather than one
#
# `id-token: write` authorises minting this workflow's OIDC identity, and that
# identity IS the npm publishing credential. Installing a third-party CLI inside
# a job that holds it means the package's install-time lifecycle scripts could
# request an identity token and publish anything under this name. So the ClawHub
# work runs in its own job with `permissions: contents: read` and no `id-token`,
# and installs with lifecycle scripts disabled.
#
# The token-presence check is a job of its own for two reasons: it reports a
# boolean, so CLAWHUB_TOKEN never sits in the environment of the job that holds
# the npm identity; and it runs before anything ships, because a release that
# goes out on npm while the listing is left behind is exactly the failure this
# workflow made silently for two releases (measured 2026-10-08).

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Really publish (unchecked = dry-run rehearsal)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    # Holds a credential and mints nothing.
    permissions: {}
    outputs:
      clawhub-token: ${{ steps.check.outputs.clawhub-token }}
    steps:
      - name: Is the ClawHub token present?
        id: check
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          releasing="${{ github.event_name == 'push' || inputs.publish == true }}"
          if [ -n "$CLAWHUB_TOKEN" ]; then
            echo "clawhub-token=present" >> "$GITHUB_OUTPUT"
          elif [ "$releasing" = "true" ]; then
            echo "::error::CLAWHUB_TOKEN is not set — nothing will be published. Set it under the repository's Secrets (use the GitHub web UI: the gh CLI prompt has stored an empty value on this operator's machine twice), then re-run the tag."
            exit 1
          else
            # A rehearsal needs no credentials; the ClawHub job is skipped anyway.
            echo "clawhub-token=absent" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # registry-url keeps the documented trusted-publishing shape. The
      # repository's retired NPM_TOKEN secret is deleted, so setup-node has
      # nothing to write into a .npmrc and OIDC is the only way to authenticate
      # — a token in the environment previously took the publish down a path
      # that could only fail.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve the version being shipped
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: The tag must name the version being shipped
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag v$TAG does not match package.json ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Test suite
        run: npm test

      - name: Skip the upload when this version is already on npm
        id: gate
        run: |
          PKG="${{ steps.version.outputs.version }}"
          if npm view "euthyna@$PKG" version >/dev/null 2>&1; then
            echo "euthyna@$PKG is already on the registry; the upload is skipped"
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "euthyna@$PKG is new"
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render the release notes (rehearsal preview)
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: |
          sed "s/{{version}}/${{ steps.version.outputs.version }}/g" \
            .github/release-notes-template.md > release-notes.md
          cat release-notes.md

      - name: Publish (rehearsal, nothing is uploaded)
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true && steps.gate.outputs.already-published != 'true'
        run: npm publish --dry-run

      - name: Publish
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish == true)) &&
          steps.gate.outputs.already-published != 'true'
        run: npm publish --provenance --loglevel=verbose

      - name: Create the GitHub release
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish == true)) &&
          steps.gate.outputs.already-published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.version.outputs.version }}
        run: |
          sed "s/{{version}}/$PKG/g" .github/release-notes-template.md > release-notes.md
          gh release create "v$PKG" --title "euthyna $PKG" --notes-file release-notes.md

  # ClawHub has no pull-through: its registry only carries what a publisher
  # pushes, so without this job the listing falls behind npm and nothing reports
  # it. It is deliberately NOT gated on already-published — "npm already has
  # this version" says nothing about whether the listing does, and that coupling
  # was a second way to skip.
  #
  # Concurrency serialises the listing, so two releases cannot interleave and an
  # older one leave `latest` pointing backwards.
  clawhub:
    needs: [preflight, publish]
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true)) &&
      needs.preflight.outputs.clawhub-token == 'present'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: clawhub-listing
      cancel-in-progress: false
    # The registry settles on the order of tens of minutes (see the verify
    # step's note), so this job waits; the ceiling keeps a wedged read from
    # hanging a release forever.
    timeout-minutes: 90
    env:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
      CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
    steps:
      # fetch-depth: 0 because the changelog is derived from the commits between
      # the previous tag and this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned, and installed with lifecycle scripts disabled: this is the step
      # that runs third-party package code, and it must not execute install-time
      # payloads at all. The pin is the version whose verify replies were read
      # on 2026-10-08.
      - name: Install the ClawHub CLI
        run: |
          npm install -g --ignore-scripts clawhub@0.23.3
          clawhub --cli-version

      - name: Log in
        run: clawhub login --token "$CLAWHUB_TOKEN" --label "github-actions-publish"

      - name: Publish the skills to ClawHub (zh + en)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          SHA="${{ github.sha }}"
          # Changelog: the conventional-commit subjects since the previous tag.
          # This repo's history IS the change summary, so it is derived here
          # instead of being hand-maintained in two more places. First release
          # (no previous tag) falls back to the package description.
          PREV_TAG="$(git describe --tags --abbrev=0 "$SHA"^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="$(git log --format='- %s' "$PREV_TAG..$SHA" | head -15)"
          else
            CHANGELOG="euthyna $PKG — $(node -p "require('./package.json').description")"
          fi

          # Both publishes pass `--tags latest`, which moves a pointer, so an
          # older tag must not be able to drag the listing backwards. This read
          # fails CLOSED: an unreadable listing is not the same thing as a
          # listing that holds nothing, and treating the two alike is how a
          # rate-limit reply ends up moving latest blindly.
          for slug in euthyna euthyna-en; do
            current=""
            for i in 1 2 3; do
              raw="$( { clawhub skill verify "$slug" 2>&1 || true; } )"
              parsed="$(printf '%s' "$raw" | node tools/clawhub-listing.mjs)"
              kind="$(printf '%s' "$parsed" | cut -d'|' -f1)"
              text="$(printf '%s' "$parsed" | cut -d'|' -f2)"
              version="$(printf '%s' "$parsed" | cut -d'|' -f4)"
              if [ -n "$version" ]; then
                current="$version"
                break
              fi
              case "$text" in
                # Nothing published yet is an empty listing, not a failed read.
                *"not found"*|*"no version"*|*"No skill"*) current="none"; break ;;
              esac
              echo "$slug preflight read $i/3 returned no version ($kind: $text)"
              sleep 60
            done
            if [ -z "$current" ]; then
              echo "::error::cannot read $slug's current listing after 3 attempts — refusing to publish rather than move latest blindly"
              exit 1
            fi
            if [ "$current" != "none" ]; then
              verdict="$(node tools/clawhub-listing.mjs --compare "$PKG" "$current")"
              echo "$slug currently lists $current; candidate $PKG compares: $verdict"
              if [ "$verdict" != "newer" ] && [ "$verdict" != "same" ]; then
                echo "::error::$slug already lists $current, which is not older than $PKG — refusing to move latest backwards"
                exit 1
              fi
            fi
          done

          clawhub skill publish \
            --slug euthyna --name euthyna --version "$PKG" \
            --categories security,development \
            --topics "security-audit,code-audit,git-forensics,owasp" \
            --source-repo "${{ github.repository }}" --source-commit "$SHA" \
            --source-path .agents/skills/euthyna \
            --changelog "$CHANGELOG" \
            --tags latest .agents/skills/euthyna
          clawhub skill publish \
            --slug euthyna-en --name "euthyna (English)" --version "$PKG" \
            --categories security,development \
            --topics "security-audit,code-audit,git-forensics,owasp" \
            --source-repo "${{ github.repository }}" --source-commit "$SHA" \
            --source-path .agents/skills/euthyna-en \
            --changelog "English edition. Changes in $PKG: $CHANGELOG" \
            --tags latest .agents/skills/euthyna-en

      # A push is not a listing. `clawhub skill publish` returns once the
      # submission is queued; the registry then generates a skill card and runs
      # its security scan asynchronously. Measured on 2026-10-08: minutes after
      # a real push both slugs read decision=fail / reasons=["card.missing"],
      # the English edition also security=suspicious, and neither had settled
      # half an hour later — both reached pass / clean / benign / high only
      # after that. The budget is sized to that observation, not to optimism.
      #
      # Every read is captured rather than trusted as a command status: a reply
      # is data to inspect, and the CLI's exit code must not end the step before
      # the loop sees what came back. Anything short of `pass` is retried until
      # the budget runs out, so a genuine rejection costs a bounded wait instead
      # of a wrong verdict — the alternative is mistaking an in-flight scan for a
      # decision, which reports a healthy release as dead.
      - name: Verify the ClawHub listing reached decision=pass
        run: |
          PKG="$(node -p "require('./package.json').version")"
          attempts=25
          settle_seconds=150
          failed=0

          for slug in euthyna euthyna-en; do
            passed=0
            for i in $(seq 1 "$attempts"); do
              out="$( { clawhub skill verify "$slug" --version "$PKG" 2>&1 || true; } | node tools/clawhub-listing.mjs )"
              decision="$(printf '%s' "$out" | cut -d'|' -f1)"
              reasons="$(printf '%s' "$out" | cut -d'|' -f2)"
              security="$(printf '%s' "$out" | cut -d'|' -f3)"
              echo "attempt $i/$attempts: $slug@$PKG decision=$decision security=$security reasons=$reasons"
              if [ "$decision" = "pass" ]; then
                passed=1
                break
              fi
              sleep "$settle_seconds"
            done

            if [ "$passed" != "1" ]; then
              echo "::error::$slug@$PKG never reached decision=pass within the budget (last read: $out)"
              failed=1
              continue
            fi

            # decision=pass for the version says the release is healthy; the
            # pointer is a separate claim — check it moved to this release.
            latest="$( { clawhub skill verify "$slug" 2>&1 || true; } | node tools/clawhub-listing.mjs | cut -d'|' -f4 )"
            echo "$slug: latest=$latest expected=$PKG"
            if [ "$latest" != "$PKG" ]; then
              echo "::error::$slug lists $latest as latest after publishing $PKG — the pointer did not move"
              failed=1
            fi
            sleep 45
          done
          exit "$failed"
